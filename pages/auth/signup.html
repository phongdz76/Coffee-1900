<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../assets/coffee-cup.png" type="image/x-icon">
    <link rel="stylesheet" href="./auth.css">
    <title>Đăng Ký | Coffee 1900</title>
</head>

<body data-page="signup">
    <div class="auth-container">
        <div class="auth-decoration" aria-hidden="true">
            <span class="bean bean-1"></span>
            <span class="bean bean-2"></span>
            <span class="bean bean-3"></span>
        </div>

        <a href="../../index.html" class="close-btn" aria-label="Về trang chủ">
            <span>x</span>
        </a>

        <main class="auth-card" aria-labelledby="signupHeading">
            <header class="auth-header">
                <div class="brand">
                    <img src="../../assets/coffee-cup.png" alt="Coffee 1900 logo">
                    <h1 id="signupHeading">Tạo Tài Khoản</h1>
                </div>
                <p>Đăng ký tài khoản để lưu đơn hàng và thanh toán nhanh hơn.</p>
            </header>

            <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>

            <form id="signupForm" class="auth-form" novalidate>
                <label class="field-label" for="fullName">Họ và tên</label>
                <div class="field-box">
                    <input type="text" id="fullName" name="fullName" placeholder="Nguyễn Văn A" required>
                </div>

                <label class="field-label" for="username">Tên đăng nhập</label>
                <div class="field-box">
                    <input type="text" id="username" name="username" placeholder="toi_thich_coffee" required>
                </div>

                <label class="field-label" for="email">Email</label>
                <div class="field-box">
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <label class="field-label" for="password">Mật khẩu</label>
                <div class="field-box with-toggle">
                    <input type="password" id="password" name="password" placeholder="Tối thiểu 6 ký tự" required>
                    <button type="button" class="toggle-password" data-toggle-password="password"
                        aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path
                                d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.72 21.72 0 0 1 5.08-5.91M9.88 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a21.72 21.72 0 0 1-3.17 4.36">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <label class="field-label" for="confirmPassword">Nhập lại mật khẩu</label>
                <div class="field-box with-toggle">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu"
                        required>
                    <button type="button" class="toggle-password" data-toggle-password="confirmPassword"
                        aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path
                                d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.72 21.72 0 0 1 5.08-5.91M9.88 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a21.72 21.72 0 0 1-3.17 4.36">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span>Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật.</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn">Đăng Ký</button>
            </form>

            <footer class="auth-footer">
                <p>Đã có tài khoản? <a id="loginLink" href="./login.html">Đăng nhập ngay</a></p>
            </footer>
        </main>
    </div>

    <script type="module" src="./auth.js"></script>
</body>

</html>
