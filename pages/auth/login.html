<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../../assets/coffee-cup.png" type="image/x-icon">
    <link rel="stylesheet" href="./auth.css">
    <title>Đăng Nhập | Coffee 1900</title>
</head>

<body data-page="login">
    <div class="auth-container">
        <div class="auth-decoration" aria-hidden="true">
            <span class="bean bean-1"></span>
            <span class="bean bean-2"></span>
            <span class="bean bean-3"></span>
        </div>

        <a href="../../index.html" class="close-btn" aria-label="Về trang chủ">
            <span>x</span>
        </a>

        <main class="auth-card" aria-labelledby="loginHeading">
            <header class="auth-header">
                <div class="brand">
                    <img src="../../assets/coffee-cup.png" alt="Coffee 1900 logo">
                    <h1 id="loginHeading">Coffee 1900</h1>
                </div>
                <p>Đăng nhập để tiếp tục mua sắm và quản lý giỏ hàng.</p>
            </header>

            <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>

            <form id="loginForm" class="auth-form" novalidate>
                <label class="field-label" for="identifier">Tên đăng nhập hoặc email</label>
                <div class="field-box">
                    <input type="text" id="identifier" name="identifier" placeholder="Ví dụ: phongdz" required>
                </div>

                <label class="field-label" for="password">Mật khẩu</label>
                <div class="field-box with-toggle">
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                    <button type="button" class="toggle-password" data-toggle-password="password"
                        aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path
                                d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.72 21.72 0 0 1 5.08-5.91M9.88 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a21.72 21.72 0 0 1-3.17 4.36">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Ghi nhớ tài khoản trên thiết bị này</span>
                    </label>
                </div>

                <button type="submit" class="submit-btn">Đăng Nhập</button>
            </form>

            <footer class="auth-footer">
                <p>Chưa có tài khoản? <a id="signupLink" href="./signup.html">Đăng ký ngay</a></p>
            </footer>
        </main>
    </div>

    <script type="module" src="./auth.js"></script>
</body>

</html>
